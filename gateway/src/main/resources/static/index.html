<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AgentDome · 课堂演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
<script>
MathJax = { tex:{ inlineMath:[['$','$'],['\\(','\\)']], displayMath:[['$$','$$'],['\\[','\\]']], processEscapes:true } };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
:root {
  --bg:#0d1117; --surface:#161b22; --surface2:#21262d; --border:#30363d;
  --gold:#d2991d; --gold-dim:#9e6a03; --gold-bright:#e3b341;
  --text:#e6edf3; --text-dim:#8b949e; --text-faint:#484f58;
  --blue:#58a6ff; --green:#3fb950; --red:#f85149;
}

*{margin:0;padding:0;box-sizing:border-box}
html{font-size:18px}
body{
  font-family:'Source Serif 4',Georgia,serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; line-height:1.7;
}

input[type=file]{display:none}
.hidden{display:none!important}

/* ═══════ LOGIN ═══════ */
.login-screen{
  position:fixed;inset:0;z-index:10;background:var(--bg);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2rem;
}
.login-card{
  width:420px;max-width:90vw;padding:3rem 2.5rem;text-align:center;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
}
.login-title{
  font-family:'Playfair Display',Georgia,serif;
  font-size:2.4rem;font-weight:700;color:var(--text);margin-bottom:.25rem;
}
.login-sub{color:var(--text-dim);font-size:.95rem;margin-bottom:1.8rem}
#loginError{color:var(--red);font-size:.85rem;margin-top:.8rem}
.login-input{
  width:100%;padding:.9rem 1rem;margin-bottom:.7rem;font-size:.95rem;
  font-family:'Source Serif 4',Georgia,serif;
  background:var(--bg);border:1px solid var(--border);color:var(--text);
  border-radius:8px;outline:none;transition:.2s;
}
.login-input:focus{border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(210,153,29,.15)}
.login-input::placeholder{color:var(--text-faint)}
.btn{
  display:block;width:100%;padding:.85rem 1.5rem;font-size:.95rem;
  font-family:'Source Serif 4',Georgia,serif;cursor:pointer;border:none;
  border-radius:8px;letter-spacing:.03em;transition:all .2s;font-weight:500;
}
.btn-primary{background:var(--gold-dim);color:#fff}
.btn-primary:hover{background:var(--gold)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim)}
.btn-ghost:hover{border-color:var(--gold-dim);color:var(--text)}
.login-divider{
  display:flex;align-items:center;gap:.75rem;margin:1.2rem 0;
  color:var(--text-faint);font-size:.8rem;
}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* ═══════ MAIN ═══════ */
.app{max-width:900px;margin:0 auto;padding:1.5rem 2rem 3rem}

/* Top bar */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.8rem 0 1.2rem;border-bottom:1px solid var(--border);margin-bottom:2rem;
}
.brand{display:flex;align-items:center;gap:.6rem}
.brand-icon{
  width:36px;height:36px;border-radius:8px;
  background:linear-gradient(135deg,var(--gold-dim),var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;font-family:'JetBrains Mono',monospace;color:#fff;font-weight:600;
}
.brand-text{font-family:'Playfair Display',Georgia,serif;font-size:1.3rem;font-weight:700}
.user-tag{display:flex;align-items:center;gap:.3rem;font-size:.75rem;color:var(--text-dim)}
.user-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.user-tag .dot.off{background:var(--text-faint)}

/* Upload card */
.upload-card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:2rem;margin-bottom:2rem;
}
.upload-card h2{
  font-family:'Playfair Display',Georgia,serif;font-size:1.15rem;
  font-weight:700;color:var(--text);margin-bottom:1rem;
}
.upload-zone{
  border:2px dashed var(--border);border-radius:10px;
  padding:2.5rem 2rem;text-align:center;cursor:pointer;transition:all .25s;
  margin-bottom:1.2rem;
}
.upload-zone:hover,.upload-zone.drag-over{
  border-color:var(--gold-dim);background:rgba(210,153,29,.04);
}
.upload-zone .icon{font-size:2.5rem;margin-bottom:.4rem}
.upload-zone .text{font-size:.95rem;color:var(--text-dim)}
.upload-zone .hint{font-size:.75rem;color:var(--text-faint);margin-top:.3rem}
.upload-zone .preview{max-width:100%;max-height:200px;margin-top:.8rem;display:none;border-radius:8px}
.upload-zone .preview.show{display:block}

.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{
  padding:.55rem 1rem;font-size:.82rem;font-family:'JetBrains Mono',monospace;
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  color:var(--text-dim);cursor:pointer;transition:all .2s;
}
.chip:hover{border-color:var(--gold-dim);color:var(--gold-bright)}
.chip.active{background:rgba(210,153,29,.15);border-color:var(--gold);color:var(--gold-bright)}

/* Messages */
.chat-list{display:flex;flex-direction:column;gap:1.5rem}
.empty-state{text-align:center;padding:4rem 2rem}
.empty-icon{font-size:3.5rem;margin-bottom:1rem;opacity:.3}
.empty-title{font-family:'Playfair Display',Georgia,serif;font-size:1.5rem;color:var(--text-dim)}
.empty-sub{font-size:.9rem;color:var(--text-faint);margin-top:.5rem;line-height:1.7}

.msg{animation:msgIn .35s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.msg-header .role-avatar{
  width:28px;height:28px;border-radius:6px;font-size:.65rem;
  font-family:'JetBrains Mono',monospace;
  display:flex;align-items:center;justify-content:center;
}
.msg.user .role-avatar{background:var(--gold-dim);color:#fff}
.msg.assistant .role-avatar{background:var(--surface2);color:var(--blue);border:1px solid var(--border)}
.msg-header .role-name{font-size:.78rem;font-weight:600}
.msg.user .role-name{color:var(--gold-bright)}
.msg.assistant .role-name{color:var(--blue)}
.msg-header .role-time{font-size:.65rem;color:var(--text-faint);font-family:'JetBrains Mono',monospace}
.msg.user .msg-header{flex-direction:row-reverse}

.msg-body{padding:.6rem 0}
.msg.user .msg-body{text-align:right}
.msg-bubble{
  display:inline-block;max-width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:1.2rem 1.5rem;font-size:.95rem;line-height:1.85;
  white-space:pre-wrap;word-break:break-word;
}
.msg.assistant .msg-bubble{
  background:transparent;border:none;border-left:3px solid var(--border);
  border-radius:0;padding:.1rem 0 .1rem 1.2rem;max-width:100%;
}
.msg.assistant .msg-bubble.streaming{border-left-color:var(--gold)}
.stream-cursor{
  display:inline-block;width:2px;height:1.1em;background:var(--gold);
  vertical-align:text-bottom;animation:cBlink .7s infinite;margin-left:1px;
}
@keyframes cBlink{0%,100%{opacity:1}50%{opacity:0}}

/* ── Markdown in messages ── */
.markdown-body{line-height:1.9}
.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4{
  font-family:'Playfair Display',Georgia,serif;font-weight:700;
  margin:1.2em 0 .4em;color:var(--gold-bright);
}
.markdown-body h1{font-size:1.4rem}.markdown-body h2{font-size:1.2rem}.markdown-body h3{font-size:1.05rem}
.markdown-body h4{font-size:.95rem}
.markdown-body p{margin:.4em 0}
.markdown-body strong{color:var(--gold-bright);font-weight:600}
.markdown-body em{color:var(--text-dim)}
.markdown-body ul,.markdown-body ol{padding-left:1.5em;margin:.4em 0}
.markdown-body li{margin:.2em 0}
.markdown-body code{
  font-family:'JetBrains Mono',monospace;font-size:.85rem;
  background:rgba(210,153,29,.1);color:var(--gold-bright);
  padding:.1em .35em;border-radius:3px;
}
.markdown-body pre{
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:.9em 1.2em;overflow-x:auto;margin:.6em 0;font-size:.85rem;line-height:1.55;
}
.markdown-body pre code{background:transparent;padding:0;color:var(--text);font-size:inherit}
.markdown-body table{border-collapse:collapse;margin:.6em 0;width:100%}
.markdown-body td,.markdown-body th{
  border:1px solid var(--border);padding:.45em .8em;text-align:left;font-size:.85rem;
}
.markdown-body th{background:var(--surface2);color:var(--gold-dim);font-weight:600}
.markdown-body blockquote{
  border-left:3px solid var(--gold-dim);padding:.2em 1em;
  margin:.5em 0;color:var(--text-dim);font-style:italic;
}
.markdown-body a{color:var(--blue)}
.markdown-body img{max-width:100%;margin:.4em 0}
.markdown-body hr{border:none;border-top:1px solid var(--border);margin:.8em 0}

/* MathJax */
mjx-container{font-size:1em!important;color:var(--text)!important}
mjx-container[jax=CHTML][display=true]{margin:.7em 0;overflow-x:auto}

@media(max-width:640px){
  html{font-size:16px}
  .app{padding:1rem}
  .upload-card{padding:1.2rem}
  .msg-bubble{font-size:.9rem}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
<div class="login-card">
  <div class="login-title">AgentDome</div>
  <div class="login-sub">AI 智能解题助手 · 课堂演示</div>
  <button class="btn btn-primary" id="btnGuest" onclick="doGuestLogin()">游客登录</button>
  <div class="login-divider">或输入你的名字</div>
  <input class="login-input" id="nickInput" placeholder="输入昵称" maxlength="20">
  <button class="btn btn-primary" id="btnNamed" onclick="doNamedLogin()">进入演示</button>
  <div class="hidden" id="loginError"></div>
</div>
</div>

<!-- MAIN APP -->
<div class="app hidden" id="mainApp">
<div class="topbar">
  <div class="brand">
    <div class="brand-icon">AD</div>
    <span class="brand-text">AgentDome</span>
  </div>
  <div class="user-tag">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">连接中…</span>
    <span style="margin-left:.5rem" id="userName">--</span>
  </div>
</div>

<div class="upload-card">
  <h2>📸 上传题目</h2>
  <div class="upload-zone" id="uploadZone">
    <div class="icon" id="uploadIcon">⊞</div>
    <div class="text" id="uploadText">拖拽图片到此处 或 点击选择文件</div>
    <div class="hint">支持 PNG / JPG，建议截图清晰</div>
    <img class="preview" id="previewImg">
  </div>
  <input type="file" id="fileInput" accept="image/*">
  <div class="chips">
    <div class="chip active" data-subject="ACM">⊿ 算法竞赛</div>
    <div class="chip" data-subject="MATH">∫ 高等数学</div>
    <div class="chip" data-subject="CS408">⊕ 考研 408</div>
  </div>
</div>

<div class="chat-list" id="chatList">
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">◈</div>
    <div class="empty-title">准备开始演示</div>
    <div class="empty-sub">上传一道题目图片<br>AI 将实时流式输出完整解答过程</div>
  </div>
</div>
</div>

<script>
var S={token:null,userId:null,nick:'',sessionId:null,ws:null,subject:'ACM',file:null};
var $=function(s){return document.querySelector(s);};
var $$=function(s){return document.querySelectorAll(s);};
var _streamText='';

// ── Marked + MathJax ──
if(typeof marked!=='undefined'){
  marked.setOptions({highlight:function(c,l){if(l&&hljs.getLanguage(l))return hljs.highlight(c,{language:l}).value;return hljs.highlightAuto(c).value;},breaks:true,gfm:true});
}
function md(s){try{return marked.parse(s)}catch(e){return esc(s)}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function typeset(el){if(window.MathJax)MathJax.typesetPromise([el]).catch(function(){})}
function now(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}

// ── Login ──
async function doGuestLogin(){
  var b=$('#btnGuest');b.textContent='登录中…';b.disabled=true;
  try{
    var r=await fetch('/api/auth/guest',{method:'POST',headers:{'Content-Type':'application/json'}});
    var d=await r.json();
    if(d.token)enterApp(d.token,d.userId,d.nickname||'观众');
  }catch(e){showError('连接失败，确认后端已启动');b.textContent='游客登录';b.disabled=false;}
}
async function doNamedLogin(){
  var n=$('#nickInput').value.trim();if(!n){showError('请输入昵称');return;}
  var b=$('#btnNamed');b.textContent='登录中…';b.disabled=true;
  try{
    var r=await fetch('/api/auth/guest',{method:'POST',headers:{'Content-Type':'application/json'}});
    var d=await r.json();
    if(d.token)enterApp(d.token,d.userId,n);
  }catch(e){showError('连接失败');b.textContent='进入演示';b.disabled=false;}
}
function showError(m){var e=$('#loginError');e.textContent=m;e.classList.remove('hidden');setTimeout(function(){e.classList.add('hidden')},3000)}
$('#nickInput').onkeydown=function(e){if(e.key==='Enter')doNamedLogin()}
function enterApp(t,u,n){
  S.token=t;S.userId=u;S.nick=n;
  $('#loginScreen').classList.add('hidden');$('#mainApp').classList.remove('hidden');
  $('#userName').textContent=n;connectWS();
}

// ── WebSocket ──
function connectWS(){
  var p=location.protocol==='https:'?'wss':'ws';
  S.ws=new WebSocket(p+'://'+location.host+'/ws/chat?token='+S.token);
  S.ws.onopen=function(){setStatus(true,'在线')};
  S.ws.onmessage=function(e){
    var m=JSON.parse(e.data);
    if(m.type==='connected'){S.sessionId=m.sessionId}
    else if(m.type==='solve-start'){addMsg('assistant','',true)}
    else if(m.type==='solve-chunk'){appendStream(m.chunk)}
    else if(m.type==='solve-done'){finishStream()}
    else if(m.type==='solve-error'){appendStream('\n\n[错误: '+m.message+']');finishStream()}
    else if(m.type==='message'){addMsg('assistant',m.content)}
  };
  S.ws.onclose=function(){setStatus(false,'断开');setTimeout(connectWS,3000)};
  S.ws.onerror=function(){setStatus(false,'错误')};
}
function setStatus(on,m){$('#statusDot').className='dot'+(on?'':' off');$('#statusText').textContent=m}

// ── Messages ──
function hideEmpty(){var e=$('#emptyState');if(e)e.style.display='none'}
function addMsg(role,text,streaming){
  hideEmpty();
  var d=document.createElement('div');d.className='msg '+role;
  var av=role==='assistant'?'AI':(S.nick.charAt(0)||'?');
  var rn=role==='assistant'?'AI 助手':S.nick;
  var cls=streaming?' streaming':'',isMd=role==='assistant'&&text;
  if(streaming){_streamText=''}
  var ct=isMd?md(text):esc(text);
  d.innerHTML='<div class="msg-header"><div class="role-avatar">'+av+'</div><span class="role-name">'+rn+'</span><span class="role-time">'+now()+'</span></div>'+
    '<div class="msg-body"><div class="msg-bubble'+cls+(isMd?' markdown-body':'')+'">'+ct+(streaming?'<span class="stream-cursor"></span>':'')+'</div></div>';
  $('#chatList').appendChild(d);
  if(isMd&&!streaming)typeset(d);
  d.scrollIntoView({behavior:'smooth',block:'end'});
}
function appendStream(text){
  _streamText+=text;
  var ms=$$('#chatList .msg.assistant');var l=ms[ms.length-1];if(!l)return;
  l.querySelector('.msg-bubble').innerHTML=esc(_streamText)+'<span class="stream-cursor"></span>';
  l.scrollIntoView({behavior:'smooth',block:'end'});
}
function finishStream(){
  var ms=$$('#chatList .msg.assistant');var l=ms[ms.length-1];if(!l)return;
  var b=l.querySelector('.msg-bubble');b.classList.remove('streaming');b.classList.add('markdown-body');
  b.innerHTML=md(_streamText);typeset(b);_streamText='';
}

// ── Subject chips ──
$$('.chip').forEach(function(c){c.onclick=function(){$$('.chip').forEach(function(x){x.classList.remove('active')});c.classList.add('active');S.subject=c.dataset.subject}});

// ── Upload ──
var zone=$('#uploadZone'),input=$('#fileInput');
zone.onclick=function(){input.click()};
zone.ondragover=function(e){e.preventDefault();zone.classList.add('drag-over')};
zone.ondragleave=function(){zone.classList.remove('drag-over')};
zone.ondrop=function(e){e.preventDefault();zone.classList.remove('drag-over');if(e.dataTransfer.files[0]){input.files=e.dataTransfer.files;proc(e.dataTransfer.files[0])}};
input.onchange=function(){if(input.files[0])proc(input.files[0])};

function proc(file){
  S.file=file;$('#uploadText').textContent=file.name;$('#uploadIcon').textContent='✓';zone.style.borderColor='var(--gold-dim)';
  var r=new FileReader();r.onload=function(e){$('#previewImg').src=e.target.result;$('#previewImg').classList.add('show')};r.readAsDataURL(file);
  upload();
}
async function upload(){
  if(!S.file||!S.token)return;
  var f=new FormData();f.append('file',S.file);f.append('subjectType',S.subject);f.append('sessionId',S.sessionId||'web');f.append('token',S.token);
  addMsg('user','📷 '+S.subject+' 题目');
  addMsg('assistant','⏳ 正在识别图片文字…');
  try{
    var r=await fetch('/api/chat/upload?token='+S.token,{method:'POST',body:f});
    var d=await r.json();
    var bs=$$('#chatList .msg.assistant .msg-bubble');var lb=bs[bs.length-1];
    if(d.code===200){
      lb.innerHTML='📷 识别结果：<br><br>'+esc(d.data.cleanedText);lb.style.borderLeftColor='var(--green)';
      if(S.ws&&S.ws.readyState===WebSocket.OPEN)S.ws.send(JSON.stringify({type:'solve',text:d.data.cleanedText,subjectType:d.data.subjectType}));
    }else{lb.innerHTML='✕ 识别失败';lb.style.borderLeftColor='var(--red)'}
  }catch(e){addMsg('assistant','✕ 网络错误: '+e.message)}
  S.file=null;input.value='';$('#uploadText').textContent='拖拽图片到此处 或 点击选择文件';$('#uploadIcon').textContent='⊞';zone.style.borderColor='';$('#previewImg').classList.remove('show');
}
</script>
</body>
</html>
