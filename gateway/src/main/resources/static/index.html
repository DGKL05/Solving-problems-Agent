<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AgentDome · AI 解题助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
<script>
MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']],processEscapes:true}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
:root {
  --cream:#faf8f5; --white:#fff; --ink:#1b1b1b; --ink2:#5c5c5c;
  --ink3:#999894; --border:#e7e4df; --shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06);
  --accent:#2c6bae; --accent-lt:#e8f0f8; --copper:#b87333; --copper-lt:#fdf2e4;
  --green:#2d8a56; --red:#c93535; --code-bg:#f6f4f0;
}

*{margin:0;padding:0;box-sizing:border-box}
html{font-size:18px}
body{
  font-family:'Source Serif 4',Georgia,serif;
  background:var(--cream);color:var(--ink);min-height:100vh;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse at 20% 0%,rgba(44,107,174,.03),transparent 60%),
    radial-gradient(ellipse at 80% 100%,rgba(184,115,51,.02),transparent 60%);
}

input[type=file]{display:none}
.hidden{display:none!important}

/* ═══════ LOGIN ═══════ */
.login-screen{
  position:fixed;inset:0;z-index:10;background:var(--cream);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2.5rem;
}
.login-card{
  width:420px;max-width:90vw;padding:3rem 2.5rem;text-align:center;
  background:var(--white);border:1px solid var(--border);border-radius:16px;
  box-shadow:0 4px 24px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.05);
}
.login-mark{
  display:inline-block;font-family:'JetBrains Mono',monospace;
  font-size:.65rem;color:var(--accent);letter-spacing:.2em;
  border:1px solid var(--accent-lt);padding:.3em .7em;margin-bottom:1.5rem;
  background:var(--accent-lt);
}
.login-title{
  font-family:'Playfair Display',Georgia,serif;
  font-size:2.4rem;font-weight:700;color:var(--ink);margin-bottom:.2rem;
  letter-spacing:-.02em;
}
.login-sub{color:var(--ink2);font-size:.9rem;margin-bottom:2rem}
#loginError{color:var(--red);font-size:.85rem;margin-top:.8rem}
.login-input{
  width:100%;padding:.85rem 1rem;margin-bottom:.7rem;font-size:.92rem;
  font-family:'Source Serif 4',Georgia,serif;
  background:var(--cream);border:1px solid var(--border);color:var(--ink);
  border-radius:10px;outline:none;transition:.2s;
}
.login-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(44,107,174,.1)}
.login-input::placeholder{color:var(--ink3)}
.btn{
  display:block;width:100%;padding:.85rem 1.5rem;font-size:.92rem;
  font-family:'Source Serif 4',Georgia,serif;cursor:pointer;border:none;
  border-radius:10px;letter-spacing:.02em;transition:all .2s;font-weight:500;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#255a94;transform:translateY(-1px);box-shadow:0 2px 8px rgba(44,107,174,.2)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--ink2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.login-divider{
  display:flex;align-items:center;gap:.75rem;margin:1.2rem 0;
  color:var(--ink3);font-size:.78rem;
}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* ═══════ MAIN APP ═══════ */
.app{max-width:860px;margin:0 auto;padding:1.5rem 1.5rem 1rem;display:flex;flex-direction:column;height:100vh}

/* Topbar */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.55rem 1.2rem;border-radius:12px;
  background:var(--white);border:1px solid var(--border);
  box-shadow:var(--shadow);margin-bottom:.8rem;flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:.5rem}
.brand-mark{
  font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:600;
  color:var(--accent);background:var(--accent-lt);
  padding:.2rem .5rem;border-radius:5px;letter-spacing:.05em;
}
.brand-text{font-family:'Playfair Display',Georgia,serif;font-size:1.1rem;font-weight:700;color:var(--ink)}

/* Tabs */
.tabs{display:flex;gap:.3rem}
.tab{
  padding:.45rem 1rem;font-size:.8rem;cursor:pointer;border-radius:8px;
  border:1px solid transparent;color:var(--ink2);transition:all .2s;
  font-family:'Source Serif 4',Georgia,serif;
}
.tab:hover{color:var(--accent);background:var(--accent-lt)}
.tab.active{background:var(--accent-lt);color:var(--accent);border-color:var(--accent-lt);font-weight:600}

.user-tag{display:flex;align-items:center;gap:.35rem;font-size:.72rem;color:var(--ink2)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.status-dot.off{background:var(--ink3)}

/* ═══════ SOLVE PANEL ═══════ */
#solvePanel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}

/* Upload card (collapsed by default after first use) */
.upload-card{
  background:var(--white);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:1.5rem 1.8rem;margin-bottom:.8rem;flex-shrink:0;
}
.upload-card.collapsed{padding:.6rem 1.2rem;cursor:pointer}
.upload-card.collapsed .upload-body{display:none}
.upload-card-label{
  font-family:'JetBrains Mono',monospace;font-size:.62rem;text-transform:uppercase;
  letter-spacing:.15em;color:var(--accent);margin-bottom:.6rem;
  display:flex;align-items:center;justify-content:space-between;
}
.upload-card.collapsed .upload-card-label{margin-bottom:0}
.upload-card-toggle{font-size:.75rem;cursor:pointer;color:var(--ink2)}
.upload-card.collapsed .upload-card-toggle::after{content:' ▸ 展开'}
.upload-card-toggle::after{content:' ▾ 收起'}
.upload-zone{
  border:2px dashed var(--border);border-radius:12px;
  padding:2rem 1.5rem;text-align:center;cursor:pointer;transition:all .25s;
  margin-bottom:1rem;background:var(--cream);
}
.upload-zone:hover,.upload-zone.drag-over{
  border-color:var(--accent);background:var(--accent-lt);
}
.upload-zone .uz-icon{font-size:2.2rem;margin-bottom:.2rem;transition:.2s}
.upload-zone:hover .uz-icon{transform:scale(1.08)}
.upload-zone .uz-text{font-size:.9rem;color:var(--ink2)}
.upload-zone .uz-hint{font-size:.7rem;color:var(--ink3);margin-top:.25rem}
.upload-zone .preview{max-width:100%;max-height:160px;margin-top:.6rem;display:none;border-radius:10px;border:1px solid var(--border)}
.upload-zone .preview.show{display:block}

.subject-chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{
  padding:.4rem .9rem;font-size:.78rem;font-family:'JetBrains Mono',monospace;
  background:var(--cream);border:1px solid var(--border);border-radius:8px;
  color:var(--ink2);cursor:pointer;transition:all .2s;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--accent-lt);border-color:var(--accent);color:var(--accent)}

/* Chat messages area */
.chat-area{flex:1;overflow-y:auto;padding-right:.3rem;display:flex;flex-direction:column;gap:1.5rem;padding-bottom:.5rem}
.chat-area .empty-state{text-align:center;padding:4rem 2rem;margin:auto}
.empty-icon{font-size:2.8rem;margin-bottom:.6rem;opacity:.2}
.empty-title{font-size:1.1rem;color:var(--ink2);font-family:'Playfair Display',Georgia,serif}
.empty-sub{font-size:.82rem;color:var(--ink3);margin-top:.3rem;line-height:1.7}

/* Chat input bar */
.chat-input-bar{
  display:flex;gap:.5rem;padding:.6rem 0 0;flex-shrink:0;border-top:1px solid var(--border);margin-top:.5rem;
}
.chat-input{
  flex:1;padding:.7rem 1rem;font-size:.9rem;font-family:'Source Serif 4',Georgia,serif;
  background:var(--white);border:1px solid var(--border);border-radius:10px;
  color:var(--ink);outline:none;resize:none;min-height:44px;max-height:80px;
}
.chat-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(44,107,174,.08)}
.chat-input::placeholder{color:var(--ink3)}
.chat-send{
  padding:.7rem 1.4rem;background:var(--accent);color:#fff;border:none;border-radius:10px;
  font-family:'Source Serif 4',Georgia,serif;font-size:.9rem;cursor:pointer;transition:.2s;white-space:nowrap;
}
.chat-send:hover{background:#255a94}

/* Messages */
.msg{animation:fadeIn .4s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-header{display:flex;align-items:center;gap:.4rem;margin-bottom:.35rem}
.msg-avatar{
  width:24px;height:24px;border-radius:6px;font-size:.58rem;font-weight:600;
  font-family:'JetBrains Mono',monospace;
  display:flex;align-items:center;justify-content:center;
}
.msg.user .msg-avatar{background:var(--copper-lt);color:var(--copper)}
.msg.assistant .msg-avatar{background:var(--accent-lt);color:var(--accent)}
.msg-name{font-size:.75rem;font-weight:600}
.msg.user .msg-name{color:var(--copper)}
.msg.assistant .msg-name{color:var(--accent)}
.msg-time{font-size:.58rem;color:var(--ink3);font-family:'JetBrains Mono',monospace}
.msg.user .msg-header{flex-direction:row-reverse}

.msg-body{padding:.2rem 0}
.msg.user .msg-body{text-align:right}
.msg-bubble{
  display:inline-block;max-width:100%;text-align:left;white-space:pre-wrap;word-break:break-word;
}
.msg.user .msg-bubble{
  background:var(--cream);border:1px solid var(--border);border-radius:12px 12px 4px 12px;
  padding:.75rem 1rem;font-size:.9rem;line-height:1.75;
}
.msg.assistant .msg-bubble{
  font-size:.93rem;line-height:1.85;
  border-left:3px solid var(--border);padding:.1rem 0 .1rem 1.2rem;
  background:transparent;border-radius:0;
}
.msg.assistant .msg-bubble.streaming{border-left-color:var(--accent)}
.stream-cursor{
  display:inline-block;width:2px;height:1em;background:var(--accent);
  vertical-align:text-bottom;animation:cBlink .7s infinite;margin-left:1px;
}
@keyframes cBlink{0%,100%{opacity:1}50%{opacity:0}}

/* ═══════ MISTAKES PANEL ═══════ */
#mistakesPanel{flex:1;overflow-y:auto;display:none}
.mistake-card{
  background:var(--white);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);padding:1.3rem 1.5rem;margin-bottom:.8rem;
  transition:.2s;cursor:pointer;
}
.mistake-card:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(44,107,174,.08)}
.mistake-date{font-size:.7rem;color:var(--ink3);font-family:'JetBrains Mono',monospace}
.mistake-text{font-size:.88rem;color:var(--ink);margin:.4rem 0;line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mistake-meta{display:flex;gap:.6rem;align-items:center;margin-top:.5rem}
.mistake-tag{
  font-size:.68rem;padding:.15rem .6rem;border-radius:6px;
  font-family:'JetBrains Mono',monospace;
  background:var(--accent-lt);color:var(--accent);
}
.mistake-tag.error-type{background:var(--copper-lt);color:var(--copper)}
.mistake-empty{text-align:center;padding:4rem 2rem;margin:auto}
.mistake-empty .icon{font-size:2.5rem;margin-bottom:.5rem;opacity:.25}

/* ═══════ MARKDOWN ═══════ */
.markdown-body{line-height:1.95}
.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4{
  font-family:'Playfair Display',Georgia,serif;font-weight:700;
  margin:1.3em 0 .4em;color:var(--ink);
}
.markdown-body h1{font-size:1.35rem}.markdown-body h2{font-size:1.15rem}.markdown-body h3{font-size:1.02rem}
.markdown-body h4{font-size:.95rem;color:var(--ink2)}
.markdown-body p{margin:.45em 0}
.markdown-body strong{color:var(--ink);font-weight:700}
.markdown-body ul,.markdown-body ol{padding-left:1.6em;margin:.45em 0}
.markdown-body li::marker{color:var(--accent)}
.markdown-body code{
  font-family:'JetBrains Mono',monospace;font-size:.82rem;
  background:var(--code-bg);color:var(--accent);
  padding:.1em .4em;border-radius:4px;border:1px solid var(--border);
}
.markdown-body pre{
  background:var(--code-bg);border:1px solid var(--border);border-radius:10px;
  border-left:3px solid var(--accent);padding:1em 1.2em;overflow-x:auto;
  margin:.5em 0;font-size:.82rem;line-height:1.6;
}
.markdown-body pre code{background:transparent;padding:0;border:none;color:var(--ink);font-size:inherit}
.markdown-body table{border-collapse:collapse;margin:.6em 0;width:100%}
.markdown-body td,.markdown-body th{
  border:1px solid var(--border);padding:.5em .9em;text-align:left;font-size:.82rem;
}
.markdown-body th{background:var(--cream);color:var(--ink);font-weight:700}
.markdown-body blockquote{
  border-left:3px solid var(--copper);padding:.2em 1em;
  margin:.5em 0;color:var(--ink2);font-style:italic;background:var(--copper-lt);
  border-radius:0 6px 6px 0;
}
.markdown-body a{color:var(--accent);text-underline-offset:.2em}
.markdown-body img{max-width:100%;border-radius:8px}
.markdown-body hr{border:none;border-top:1px solid var(--border);margin:.8em 0}

/* MathJax */
mjx-container{font-size:1em!important;color:var(--ink)!important}
mjx-container[jax=CHTML][display=true]{margin:.7em 0;overflow-x:auto}

@media(max-width:640px){
  html{font-size:16px}
  .app{padding:.8rem}
  .upload-card{padding:1rem}
}
</style>
</head>
<body>

<!-- ═══════ LOGIN ═══════ -->
<div class="login-screen" id="loginScreen">
<div class="login-card">
  <div class="login-mark">ACADEMIC</div>
  <div class="login-title">AgentDome</div>
  <div class="login-sub">AI 智能解题助手 · 课堂演示</div>
  <button class="btn btn-primary" id="btnGuest" onclick="doGuestLogin()">游客登录</button>
  <div class="login-divider">或</div>
  <input class="login-input" id="nickInput" placeholder="输入你的名字" maxlength="20">
  <button class="btn btn-primary" id="btnNamed" onclick="doNamedLogin()">进入课堂</button>
  <div class="hidden" id="loginError"></div>
</div>
</div>

<!-- ═══════ MAIN APP ═══════ -->
<div class="app hidden" id="mainApp">
<div class="topbar">
  <div class="brand">
    <span class="brand-mark">AD</span>
    <span class="brand-text">AgentDome</span>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="solve" onclick="switchTab('solve')">解题</div>
    <div class="tab" data-tab="mistakes" onclick="switchTab('mistakes')">错题本</div>
  </div>
  <div class="user-tag">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">连接中…</span>
    <span style="margin-left:.5rem" id="userName">--</span>
  </div>
</div>

<!-- ═══ SOLVE PANEL ═══ -->
<div id="solvePanel">
  <div class="upload-card" id="uploadCard">
    <div class="upload-card-label">
      <span>UPLOAD PROBLEM</span>
      <span class="upload-card-toggle" id="uploadToggle" onclick="toggleUpload(event)"></span>
    </div>
    <div class="upload-body">
      <div class="upload-zone" id="uploadZone">
        <div class="uz-icon" id="uploadIcon">⊞</div>
        <div class="uz-text" id="uploadText">拖拽题目图片，或点击此处选择文件</div>
        <div class="uz-hint">PNG / JPG，建议清晰截图</div>
        <img class="preview" id="previewImg">
      </div>
      <input type="file" id="fileInput" accept="image/*">
      <div class="subject-chips">
        <div class="chip active" data-subject="ACM">⊿ 算法</div>
        <div class="chip" data-subject="MATH">∫ 数学</div>
        <div class="chip" data-subject="CS408">⊕ 408</div>
      </div>
    </div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">◈</div>
      <div class="empty-title">准备开始</div>
      <div class="empty-sub">上传题目图片，AI 实时流式输出解答</div>
    </div>
  </div>

  <div class="chat-input-bar">
    <input class="chat-input" id="chatInput" placeholder="输入追问… 例如：请用更简单的方法解释" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendText()}">
    <button class="chat-send" onclick="sendText()">发送</button>
  </div>
</div>

<!-- ═══ MISTAKES PANEL ═══ -->
<div id="mistakesPanel">
  <div class="mistake-empty" id="mistakesEmpty">
    <div class="icon">📋</div>
    <div class="empty-title">错题本为空</div>
    <div class="empty-sub">解题时 AI 会自动识别错题<br>你也可以在对话中告诉 AI 将题目加入错题本</div>
  </div>
</div>
</div>

<script>
var S={token:null,userId:null,nick:'',sessionId:null,ws:null,subject:'ACM',file:null,currentTab:'solve'};
var $=function(s){return document.querySelector(s);};
var $$=function(s){return document.querySelectorAll(s);};
var _streamText='';

// ── Marked + MathJax ──
if(typeof marked!=='undefined'){
  marked.setOptions({highlight:function(code,lang){if(lang&&hljs.getLanguage(lang))return hljs.highlight(code,{language:lang}).value;return hljs.highlightAuto(code).value;},breaks:true,gfm:true});
}
function md(s){try{return marked.parse(s)}catch(e){return esc(s)}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function typeset(el){if(window.MathJax)MathJax.typesetPromise([el]).catch(function(){})}
function now(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}

// ── Tab switching ──
function switchTab(tab){
  S.currentTab=tab;
  $$('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.tab===tab)});
  $('#solvePanel').style.display=tab==='solve'?'flex':'none';
  $('#mistakesPanel').style.display=tab==='mistakes'?'block':'none';
  if(tab==='mistakes')loadMistakes();
}
function toggleUpload(e){e.stopPropagation();$('#uploadCard').classList.toggle('collapsed')}

// ── Login ──
async function doGuestLogin(){
  var b=$('#btnGuest');b.textContent='登录中…';b.disabled=true;
  try{
    var r=await fetch('/api/auth/guest',{method:'POST',headers:{'Content-Type':'application/json'}});
    var d=await r.json();
    if(d.token)enterApp(d.token,d.userId,d.nickname||'观众');
  }catch(e){showError('连接失败，请确认后端已启动');b.textContent='游客登录';b.disabled=false;}
}
async function doNamedLogin(){
  var n=$('#nickInput').value.trim();if(!n){showError('请输入名字');return;}
  var b=$('#btnNamed');b.textContent='登录中…';b.disabled=true;
  try{
    var r=await fetch('/api/auth/guest',{method:'POST',headers:{'Content-Type':'application/json'}});
    var d=await r.json();
    if(d.token)enterApp(d.token,d.userId,n);
  }catch(e){showError('连接失败');b.textContent='进入课堂';b.disabled=false;}
}
function showError(m){var e=$('#loginError');e.textContent=m;e.classList.remove('hidden');setTimeout(function(){e.classList.add('hidden')},3000)}
$('#nickInput').onkeydown=function(e){if(e.key==='Enter')doNamedLogin()}
function enterApp(t,u,n){
  S.token=t;S.userId=u;S.nick=n;
  $('#loginScreen').classList.add('hidden');$('#mainApp').classList.remove('hidden');
  $('#userName').textContent=n;connectWS();
}

// ── WebSocket ──
function connectWS(){
  var proto=location.protocol==='https:'?'wss':'ws';
  S.ws=new WebSocket(proto+'://'+location.host+'/ws/chat?token='+S.token);
  S.ws.onopen=function(){setStatus(true,'在线')};
  S.ws.onmessage=function(e){
    var m=JSON.parse(e.data);
    if(m.type==='connected'){S.sessionId=m.sessionId}
    else if(m.type==='solve-start'){addMsg('assistant','',true)}
    else if(m.type==='solve-chunk'){appendStream(m.chunk)}
    else if(m.type==='solve-done'){finishStream()}
    else if(m.type==='solve-error'){appendStream('\n\n[错误: '+m.message+']');finishStream()}
    else if(m.type==='problem-saved'){}
    else if(m.type==='message'){addMsg('assistant',m.content)}
  };
  S.ws.onclose=function(){setStatus(false,'重连中…');setTimeout(connectWS,3000)};
  S.ws.onerror=function(){setStatus(false,'错误')};
}
function setStatus(on,m){$('#statusDot').className='status-dot'+(on?'':' off');$('#statusText').textContent=m}

// ── Chat Messages ──
var chatArea=$('#chatArea');
function hideEmpty(){var e=$('#emptyState');if(e)e.style.display='none'}
function addMsg(role,text,streaming){
  hideEmpty();
  var d=document.createElement('div');d.className='msg '+role;
  var av=role==='assistant'?'AI':(S.nick.charAt(0)||'?');
  var rn=role==='assistant'?'AI 助手':S.nick;
  var cls=streaming?' streaming':'';var isMd=role==='assistant'&&text;
  if(streaming)_streamText='';
  d.innerHTML='<div class="msg-header"><div class="msg-avatar">'+av+'</div><span class="msg-name">'+rn+'</span><span class="msg-time">'+now()+'</span></div>'+
    '<div class="msg-body"><div class="msg-bubble'+cls+(isMd?' markdown-body':'')+'">'+(isMd?md(text):esc(text))+(streaming?'<span class="stream-cursor"></span>':'')+'</div></div>';
  chatArea.appendChild(d);
  if(isMd&&!streaming)typeset(d);
  chatArea.scrollTop=chatArea.scrollHeight;
}
function appendStream(text){
  _streamText+=text;
  var ms=$$('#chatArea .msg.assistant');var l=ms[ms.length-1];if(!l)return;
  l.querySelector('.msg-bubble').innerHTML=esc(_streamText)+'<span class="stream-cursor"></span>';
  chatArea.scrollTop=chatArea.scrollHeight;
}
function finishStream(){
  var ms=$$('#chatArea .msg.assistant');var l=ms[ms.length-1];if(!l)return;
  var b=l.querySelector('.msg-bubble');b.classList.remove('streaming');b.classList.add('markdown-body');
  b.innerHTML=md(_streamText);typeset(b);_streamText='';
}

// ── Send Text ──
function sendText(){
  var input=$('#chatInput');var text=input.value.trim();if(!text||!S.ws||S.ws.readyState!==WebSocket.OPEN)return;
  input.value='';addMsg('user',text);
  S.ws.send(JSON.stringify({type:'text',content:text}));
}

// ── Mistakes ──
async function loadMistakes(){
  if(!S.token)return;
  try{
    var r=await fetch('/api/mistakes',{headers:{'Authorization':'Bearer '+S.token}});
    if(!r.ok){$('#mistakesPanel').innerHTML='<div class="mistake-empty"><div class="icon">📋</div><div class="empty-title">暂无错题</div></div>';return}
    var d=await r.json();
    var items=(d.data||[]);
    if(!items.length){$('#mistakesPanel').innerHTML='<div class="mistake-empty"><div class="icon">📋</div><div class="empty-title">暂无错题</div><div class="empty-sub">解题时会自动记录</div></div>';return}
    $('#mistakesPanel').innerHTML=items.map(function(m){
      var d=new Date(m.createdAt).toLocaleDateString('zh-CN');
      return '<div class="mistake-card">'+
        '<div class="mistake-date">'+d+' · #'+m.id+'</div>'+
        '<div class="mistake-text">'+esc(m.cleanedText||'题目预览')+'</div>'+
        '<div class="mistake-meta">'+
          (m.subjectType?'<span class="mistake-tag">'+esc(m.subjectType)+'</span>':'')+
          (m.errorType?'<span class="mistake-tag error-type">'+esc(m.errorType)+'</span>':'')+
          (m.memo?'<span style="font-size:.75rem;color:var(--ink2)">📝 '+esc(m.memo)+'</span>':'')+
        '</div></div>';
    }).join('');
  }catch(e){$('#mistakesPanel').innerHTML='<div class="mistake-empty"><div class="icon">⚠</div><div class="empty-title">加载失败</div></div>'}
}

// ── Subject ──
$$('.chip').forEach(function(c){c.onclick=function(){$$('.chip').forEach(function(x){x.classList.remove('active')});c.classList.add('active');S.subject=c.dataset.subject}});

// ── Upload ──
var zone=$('#uploadZone'),input=$('#fileInput');
zone.onclick=function(){input.click()};
zone.ondragover=function(e){e.preventDefault();zone.classList.add('drag-over')};
zone.ondragleave=function(){zone.classList.remove('drag-over')};
zone.ondrop=function(e){e.preventDefault();zone.classList.remove('drag-over');if(e.dataTransfer.files[0]){input.files=e.dataTransfer.files;proc(e.dataTransfer.files[0])}};
input.onchange=function(){if(input.files[0])proc(input.files[0])};

function proc(file){
  S.file=file;$('#uploadText').textContent=file.name;$('#uploadIcon').textContent='✓';zone.style.borderColor='var(--accent)';zone.style.background='var(--accent-lt)';
  var r=new FileReader();r.onload=function(e){$('#previewImg').src=e.target.result;$('#previewImg').classList.add('show')};r.readAsDataURL(file);
  upload();
}
async function upload(){
  if(!S.file||!S.token)return;
  var f=new FormData();f.append('file',S.file);f.append('subjectType',S.subject);f.append('sessionId',S.sessionId||'web');f.append('token',S.token);
  addMsg('user','📷 上传了 '+S.subject+' 题目');
  addMsg('assistant','⏳ 正在识别图片文字…');
  try{
    var r=await fetch('/api/chat/upload?token='+S.token,{method:'POST',body:f});
    var d=await r.json();
    var bs=$$('#chatArea .msg.assistant .msg-bubble');var lb=bs[bs.length-1];
    if(d.code===200){
      lb.innerHTML='📷 识别结果：<br><br>'+esc(d.data.cleanedText);lb.style.borderLeftColor='var(--green)';
      if(S.ws&&S.ws.readyState===WebSocket.OPEN)S.ws.send(JSON.stringify({type:'solve',text:d.data.cleanedText,subjectType:d.data.subjectType}));
    }else{lb.innerHTML='✕ 识别失败';lb.style.borderLeftColor='var(--red)'}
  }catch(e){addMsg('assistant','✕ 网络错误: '+e.message)}
  S.file=null;input.value='';$('#uploadText').textContent='拖拽题目图片，或点击此处选择文件';$('#uploadIcon').textContent='⊞';zone.style.borderColor='';zone.style.background='var(--cream)';$('#previewImg').classList.remove('show');
}
</script>
</body>
</html>
