<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AgentDome · AI 解题助手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
<script>
MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]'],['[',']']],processEscapes:true,processEnvironments:true},svg:{fontCache:'global'},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root {
  --cream:#faf8f5; --white:#fff; --ink:#1b1b1b; --ink2:#5c5c5c;
  --ink3:#999894; --border:#e7e4df; --shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06);
  --accent:#2c6bae; --accent-lt:#e8f0f8; --copper:#b87333; --copper-lt:#fdf2e4;
  --green:#2d8a56; --red:#c93535; --code-bg:#f6f4f0;
}

*{margin:0;padding:0;box-sizing:border-box}
html{font-size:18px}
body{
  font-family:'Source Serif 4',Georgia,serif;
  background:var(--cream);color:var(--ink);min-height:100vh;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse at 20% 0%,rgba(44,107,174,.03),transparent 60%),
    radial-gradient(ellipse at 80% 100%,rgba(184,115,51,.02),transparent 60%);
}

input[type=file]{display:none}
.hidden{display:none!important}

/* ═══════ LOGIN ═══════ */
.login-screen{
  position:fixed;inset:0;z-index:10;background:var(--cream);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2.5rem;
}
.login-card{
  width:420px;max-width:90vw;padding:3rem 2.5rem;text-align:center;
  background:var(--white);border:1px solid var(--border);border-radius:16px;
  box-shadow:0 4px 24px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.05);
}
.login-mark{
  display:inline-block;font-family:'JetBrains Mono',monospace;
  font-size:.65rem;color:var(--accent);letter-spacing:.2em;
  border:1px solid var(--accent-lt);padding:.3em .7em;margin-bottom:1.5rem;
  background:var(--accent-lt);
}
.login-title{
  font-family:'Playfair Display',Georgia,serif;
  font-size:2.4rem;font-weight:700;color:var(--ink);margin-bottom:.2rem;
  letter-spacing:-.02em;
}
.login-sub{color:var(--ink2);font-size:.9rem;margin-bottom:2rem}
#loginError{color:var(--red);font-size:.85rem;margin-top:.8rem}
.login-input{
  width:100%;padding:.85rem 1rem;margin-bottom:.7rem;font-size:.92rem;
  font-family:'Source Serif 4',Georgia,serif;
  background:var(--cream);border:1px solid var(--border);color:var(--ink);
  border-radius:10px;outline:none;transition:.2s;
}
.login-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(44,107,174,.1)}
.login-input::placeholder{color:var(--ink3)}
.btn{
  display:block;width:100%;padding:.85rem 1.5rem;font-size:.92rem;
  font-family:'Source Serif 4',Georgia,serif;cursor:pointer;border:none;
  border-radius:10px;letter-spacing:.02em;transition:all .2s;font-weight:500;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#255a94;transform:translateY(-1px);box-shadow:0 2px 8px rgba(44,107,174,.2)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--ink2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.login-divider{
  display:flex;align-items:center;gap:.75rem;margin:1.2rem 0;
  color:var(--ink3);font-size:.78rem;
}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* ═══════ MAIN APP ═══════ */
.app{max-width:100%;margin:0;padding:0;display:flex;flex-direction:column;height:100vh}

/* Topbar */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.55rem 1.2rem;border-radius:12px;
  background:var(--white);border:1px solid var(--border);
  box-shadow:var(--shadow);margin-bottom:.8rem;flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:.5rem}
.brand-mark{
  font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:600;
  color:var(--accent);background:var(--accent-lt);
  padding:.2rem .5rem;border-radius:5px;letter-spacing:.05em;
}
.brand-text{font-family:'Playfair Display',Georgia,serif;font-size:1.1rem;font-weight:700;color:var(--ink)}

/* Tabs */
.tabs{display:flex;gap:.3rem}
.tab{
  padding:.45rem 1rem;font-size:.8rem;cursor:pointer;border-radius:8px;
  border:1px solid transparent;color:var(--ink2);transition:all .2s;
  font-family:'Source Serif 4',Georgia,serif;
}
.tab:hover{color:var(--accent);background:var(--accent-lt)}
.tab.active{background:var(--accent-lt);color:var(--accent);border-color:var(--accent-lt);font-weight:600}

.user-tag{display:flex;align-items:center;gap:.35rem;font-size:.72rem;color:var(--ink2)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.status-dot.off{background:var(--ink3)}

/* ═══════ SOLVE PANEL ═══════ */
#solvePanel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}

/* Chat messages area */
.chat-area{flex:1;overflow-y:auto;padding-right:.3rem;display:flex;flex-direction:column;gap:1.5rem;padding-bottom:.5rem}
.chat-area .empty-state{text-align:center;padding:4rem 2rem;margin:auto}
.empty-icon{font-size:2.8rem;margin-bottom:.6rem;opacity:.2}
.empty-title{font-size:1.1rem;color:var(--ink2);font-family:'Playfair Display',Georgia,serif}
.empty-sub{font-size:.82rem;color:var(--ink3);margin-top:.3rem;line-height:1.7}

/* Subject chips */
.subject-chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{
  padding:.4rem .9rem;font-size:.78rem;font-family:'JetBrains Mono',monospace;
  background:var(--cream);border:1px solid var(--border);border-radius:8px;
  color:var(--ink2);cursor:pointer;transition:all .2s;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--accent-lt);border-color:var(--accent);color:var(--accent)}

/* Image preview bar above input */
.img-preview-bar{
  display:none;align-items:center;gap:.8rem;padding:.6rem 0;
  border-top:1px solid var(--border);flex-shrink:0;
}
.img-preview-bar.show{display:flex}
.img-preview-thumb{
  width:72px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--border);
}
.img-preview-name{font-size:.8rem;color:var(--ink2);flex:1}
.img-preview-close{
  cursor:pointer;font-size:1rem;color:var(--ink3);padding:.2rem;
  border:none;background:none;font-family:'JetBrains Mono',monospace;
}
.img-preview-close:hover{color:var(--red)}

/* Chat input bar */
.chat-input-bar{
  display:flex;gap:.4rem;padding:.6rem 0 0;flex-shrink:0;border-top:1px solid var(--border);margin-top:.5rem;align-items:flex-end;
}
.chat-attach{
  width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  background:var(--cream);border:1px solid var(--border);border-radius:10px;
  cursor:pointer;font-size:1.2rem;color:var(--ink2);transition:.2s;flex-shrink:0;
}
.chat-attach:hover{background:var(--accent-lt);border-color:var(--accent);color:var(--accent)}
.chat-attach.has-file{background:var(--accent-lt);border-color:var(--accent);color:var(--accent)}
.chat-input{
  flex:1;padding:.7rem 1rem;font-size:.9rem;font-family:'Source Serif 4',Georgia,serif;
  background:var(--white);border:1px solid var(--border);border-radius:10px;
  color:var(--ink);outline:none;resize:none;min-height:42px;max-height:80px;
}
.chat-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(44,107,174,.08)}
.chat-input::placeholder{color:var(--ink3)}
.chat-send{
  padding:.7rem 1.2rem;background:var(--accent);color:#fff;border:none;border-radius:10px;
  font-family:'Source Serif 4',Georgia,serif;font-size:.9rem;cursor:pointer;transition:.2s;white-space:nowrap;flex-shrink:0;
}
.chat-send:hover{background:#255a94}

/* Empty state with upload hint */
.empty-state .upload-hint-btn{
  display:inline-block;margin-top:.8rem;padding:.5rem 1.5rem;
  background:var(--accent);color:#fff;border:none;border-radius:8px;
  font-family:'Source Serif 4',Georgia,serif;font-size:.85rem;cursor:pointer;
}
.empty-state .upload-hint-btn:hover{background:#255a94}

/* Messages */
.msg{animation:fadeIn .4s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.msg-header{display:flex;align-items:center;gap:.4rem;margin-bottom:.35rem}
.msg-avatar{
  width:24px;height:24px;border-radius:6px;font-size:.58rem;font-weight:600;
  font-family:'JetBrains Mono',monospace;
  display:flex;align-items:center;justify-content:center;
}
.msg.user .msg-avatar{background:var(--copper-lt);color:var(--copper)}
.msg.assistant .msg-avatar{background:var(--accent-lt);color:var(--accent)}
.msg-name{font-size:.75rem;font-weight:600}
.msg.user .msg-name{color:var(--copper)}
.msg.assistant .msg-name{color:var(--accent)}
.msg-time{font-size:.58rem;color:var(--ink3);font-family:'JetBrains Mono',monospace}
.msg.user .msg-header{flex-direction:row-reverse}

.msg-body{padding:.2rem 0}
.msg.user .msg-body{text-align:right}
.msg-bubble{
  display:inline-block;max-width:100%;text-align:left;white-space:pre-wrap;word-break:break-word;
}
.msg.user .msg-bubble{
  background:var(--cream);border:1px solid var(--border);border-radius:12px 12px 4px 12px;
  padding:.75rem 1rem;font-size:.9rem;line-height:1.75;
}
.msg.assistant .msg-bubble{
  font-size:.93rem;line-height:1.85;
  border-left:3px solid var(--border);padding:.1rem 0 .1rem 1.2rem;
  background:transparent;border-radius:0;
}
.msg.assistant .msg-bubble.streaming{border-left-color:var(--accent)}
.stream-cursor{
  display:inline-block;width:2px;height:1em;background:var(--accent);
  vertical-align:text-bottom;animation:cBlink .7s infinite;margin-left:1px;
}
@keyframes cBlink{0%,100%{opacity:1}50%{opacity:0}}

/* ═══════ CONVERSATION MODAL ═══════ */
.conv-modal{position:fixed;inset:0;z-index:200;background:var(--cream);display:none;flex-direction:column}
.conv-modal.open{display:flex}
.conv-modal-header{
  display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem;
  background:var(--white);border-bottom:1px solid var(--border);flex-shrink:0;
}
.conv-modal-back{
  width:40px;height:40px;border:none;background:none;font-size:1.2rem;
  cursor:pointer;color:var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center;
}
.conv-modal-back:active{background:var(--cream)}
.conv-modal-title{font-family:'Playfair Display',Georgia,serif;font-size:1rem;font-weight:700;flex:1}
.conv-modal-tags{display:flex;gap:.3rem;flex-wrap:wrap}
.conv-modal-body{flex:1;overflow-y:auto;padding:1rem}
.conv-modal-body .msg{max-width:100%}
.conv-modal-body .msg.assistant .msg-bubble{font-size:.88rem}

/* ═══════ MISTAKES PANEL ═══════ */
#mistakesPanel{flex:1;overflow-y:auto;display:none;padding:.3rem .2rem}
.mistake-empty{text-align:center;padding:4rem 2rem;margin:auto}
.mistake-empty .icon{font-size:2.5rem;margin-bottom:.5rem;opacity:.25}

/* Tag Group Accordion */
.tag-group{margin-bottom:.3rem}
.tag-group-header{
  display:flex;align-items:center;gap:.6rem;padding:.75rem 1rem;
  background:var(--white);border:1px solid var(--border);border-radius:12px;
  cursor:pointer;user-select:none;transition:.2s;
}
.tag-group-header:hover{border-color:var(--accent);background:var(--accent-lt)}
.tag-group-arrow{font-size:.7rem;transition:transform .25s;color:var(--ink3);font-family:'JetBrains Mono',monospace}
.tag-group-header.open .tag-group-arrow{transform:rotate(90deg)}
.tag-group-label{font-weight:600;font-size:.9rem;color:var(--ink);font-family:'Playfair Display',Georgia,serif}
.tag-group-count{font-size:.7rem;color:var(--ink3);font-family:'JetBrains Mono',monospace;margin-left:auto}
.tag-group-body{display:none;margin-left:1.2rem;border-left:2px solid var(--border);padding-left:.8rem}
.tag-group-body.open{display:block}

/* Subgroup */
.tag-subgroup{margin:.3rem 0}
.tag-subgroup-header{
  display:flex;align-items:center;gap:.5rem;padding:.5rem .8rem;
  background:var(--cream);border:1px solid var(--border);border-radius:8px;
  cursor:pointer;user-select:none;transition:.2s;
}
.tag-subgroup-header:hover{border-color:var(--copper);background:var(--copper-lt)}
.tag-subgroup-arrow{font-size:.65rem;transition:transform .25s;color:var(--ink3);font-family:'JetBrains Mono',monospace}
.tag-subgroup-header.open .tag-subgroup-arrow{transform:rotate(90deg)}
.tag-subgroup-label{font-size:.8rem;font-weight:500;color:var(--ink2)}
.tag-subgroup-count{font-size:.65rem;color:var(--ink3);font-family:'JetBrains Mono',monospace;margin-left:auto}
.tag-subgroup-body{display:none;margin-top:.2rem}
.tag-subgroup-body.open{display:block}

/* Mistake cards (inside subgroups) */
.mistake-card{
  background:var(--white);border:1px solid var(--border);border-radius:10px;
  box-shadow:var(--shadow);padding:.8rem 1rem;margin-bottom:.35rem;
  transition:.2s;cursor:pointer;
}
.mistake-card:hover{border-color:var(--accent)}
.mistake-date{font-size:.65rem;color:var(--ink3);font-family:'JetBrains Mono',monospace}
.mistake-text{font-size:.82rem;color:var(--ink);margin:.3rem 0;line-height:1.6}
.mistake-meta{display:flex;gap:.4rem;align-items:center;margin-top:.35rem;flex-wrap:wrap}
.mistake-tag{
  font-size:.62rem;padding:.12rem .5rem;border-radius:5px;
  font-family:'JetBrains Mono',monospace;
  background:var(--accent-lt);color:var(--accent);
}
.mistake-tag.error-type{background:var(--copper-lt);color:var(--copper)}
.mistake-collapse-btn{
  font-size:.65rem;color:var(--accent);cursor:pointer;background:none;border:none;
  padding:.15rem .5rem;border-radius:4px;margin-left:.5rem;
  font-family:'Source Serif 4',Georgia,serif;
}
.mistake-collapse-btn:hover{background:var(--accent-lt)}

.mistake-detail{overflow:hidden;padding-top:.6rem;margin-top:.5rem;border-top:1px solid var(--border)}
.mistake-detail .solution-label{font-size:.75rem;color:var(--accent);font-weight:600;margin-bottom:.4rem}

/* ═══════ MARKDOWN ═══════ */
.markdown-body{line-height:1.95}
.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4{
  font-family:'Playfair Display',Georgia,serif;font-weight:700;
  margin:1.3em 0 .4em;color:var(--ink);
}
.markdown-body h1{font-size:1.35rem}.markdown-body h2{font-size:1.15rem}.markdown-body h3{font-size:1.02rem}
.markdown-body h4{font-size:.95rem;color:var(--ink2)}
.markdown-body p{margin:.45em 0}
.markdown-body strong{color:var(--ink);font-weight:700}
.markdown-body ul,.markdown-body ol{padding-left:1.6em;margin:.45em 0}
.markdown-body li::marker{color:var(--accent)}
.markdown-body code{
  font-family:'JetBrains Mono',monospace;font-size:.82rem;
  background:var(--code-bg);color:var(--accent);
  padding:.1em .4em;border-radius:4px;border:1px solid var(--border);
}
.markdown-body pre{
  background:var(--code-bg);border:1px solid var(--border);border-radius:10px;
  border-left:3px solid var(--accent);padding:1em 1.2em;overflow-x:auto;
  margin:.5em 0;font-size:.82rem;line-height:1.6;
}
.markdown-body pre code{background:transparent;padding:0;border:none;color:var(--ink);font-size:inherit}
.markdown-body table{border-collapse:collapse;margin:.6em 0;width:100%}
.markdown-body td,.markdown-body th{
  border:1px solid var(--border);padding:.5em .9em;text-align:left;font-size:.82rem;
}
.markdown-body th{background:var(--cream);color:var(--ink);font-weight:700}
.markdown-body blockquote{
  border-left:3px solid var(--copper);padding:.2em 1em;
  margin:.5em 0;color:var(--ink2);font-style:italic;background:var(--copper-lt);
  border-radius:0 6px 6px 0;
}
.markdown-body a{color:var(--accent);text-underline-offset:.2em}
.markdown-body img{max-width:100%;border-radius:8px}
.markdown-body hr{border:none;border-top:1px solid var(--border);margin:.8em 0}

/* MathJax */
mjx-container{font-size:1em!important;color:var(--ink)!important}
mjx-container[jax=CHTML][display=true]{margin:.7em 0;overflow-x:auto}

/* Sidebar */
.app-layout{display:flex;height:100vh}
.sidebar{width:280px;min-width:280px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:1.2rem 1rem .8rem;border-bottom:1px solid var(--border)}
.new-chat-btn{width:100%;padding:.65rem 1rem;background:var(--ink);color:var(--white);border:none;border-radius:8px;font-size:.85rem;font-family:'Source Serif 4',Georgia,serif;cursor:pointer;transition:opacity .2s}
.new-chat-btn:hover{opacity:.85}
.session-list{flex:1;overflow-y:auto;padding:.5rem 0}
.session-item{padding:.8rem 1rem;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
.session-item:hover{background:var(--cream)}
.session-item.active{background:var(--accent-lt);border-left:3px solid var(--accent)}
.session-item{position:relative}
.session-item-title{font-size:.8rem;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:.2rem;padding-right:1.5rem}
.session-item-meta{font-size:.65rem;color:var(--ink3)}
.session-item-del{position:absolute;top:.6rem;right:.6rem;width:20px;height:20px;line-height:20px;text-align:center;border:none;background:none;color:var(--ink3);cursor:pointer;border-radius:4px;font-size:.75rem;opacity:0;transition:opacity .15s}
.session-item:hover .session-item-del{opacity:1}
.session-item-del:hover{color:var(--red);background:rgba(201,53,53,.08)}
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-content .topbar{border-radius:0;margin-bottom:0;border-bottom:1px solid var(--border)}
.main-content #solvePanel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.main-content .chat-area{flex:1}

@media(max-width:768px){
  html{font-size:16px}
  body{background-image:none}

  /* ── Sidebar → Slide-out Drawer ── */
  .app-layout{position:relative}
  .sidebar-overlay{
    display:none;position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.35);
  }
  .sidebar-overlay.show{display:block;animation:fadeIn .2s ease-out}
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;z-index:100;width:85vw;max-width:320px;min-width:0;
    transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
    box-shadow:none;
  }
  .sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.12)}
  .sidebar-header{padding:1rem;display:flex;align-items:center;gap:.6rem}
  .sidebar-header .new-chat-btn{flex:1}
  .sidebar-close-btn{
    width:44px;height:44px;border:none;background:none;font-size:1.3rem;
    color:var(--ink2);cursor:pointer;border-radius:8px;display:flex;
    align-items:center;justify-content:center;flex-shrink:0;
  }
  .sidebar-close-btn:active{background:var(--cream)}
  .session-item{padding:.75rem 1rem}
  .session-item-title{font-size:.85rem}
  .session-item-meta{font-size:.7rem}
  .session-item-del{opacity:1;width:28px;height:28px;line-height:28px;font-size:.85rem;top:.5rem;right:.5rem}
  .session-item.active{border-left-width:4px}

  /* ── Topbar ── */
  .main-content .topbar{
    padding:.4rem .5rem;border-radius:0;gap:.3rem;flex-wrap:wrap;
  }
  .brand-mark{font-size:.55rem;padding:.12rem .35rem}
  .brand-text{font-size:.82rem}
  .hamburger{
    display:flex;align-items:center;justify-content:center;
    width:40px;height:40px;border:none;background:none;
    font-size:1.3rem;color:var(--ink);cursor:pointer;border-radius:8px;flex-shrink:0;
  }
  .hamburger:active{background:var(--cream)}
  .topbar .tabs{display:flex;gap:.15rem}
  .topbar .tab{padding:.3rem .55rem;font-size:.68rem;border-radius:6px;min-height:36px;display:flex;align-items:center}
  .user-tag{font-size:.6rem;gap:.15rem}
  .user-tag .status-dot{width:5px;height:5px}
  .user-tag button{font-size:.58rem!important;padding:.1rem .4rem!important}
  #statusText{display:none}

  /* ── Chat ── */
  #solvePanel{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .chat-area{flex:1;padding:.5rem .2rem;gap:1rem}
  .chat-area .empty-state{padding:2rem 1rem}
  .empty-icon{font-size:2rem}
  .empty-title{font-size:1rem}
  .empty-sub{font-size:.75rem}
  .empty-state .upload-hint-btn{font-size:.8rem;padding:.5rem 1.2rem}

  .msg-avatar{width:28px;height:28px;font-size:.62rem}
  .msg-name{font-size:.78rem}
  .msg-time{font-size:.6rem}
  .msg.user .msg-bubble{font-size:.85rem;padding:.6rem .85rem;border-radius:10px 10px 3px 10px}
  .msg.assistant .msg-bubble{font-size:.88rem;padding-left:1rem;border-left-width:2px}

  /* Markdown mobile */
  .markdown-body h1{font-size:1.15rem}.markdown-body h2{font-size:1.02rem}.markdown-body h3{font-size:.9rem}
  .markdown-body pre{font-size:.75rem;padding:.7rem .8rem;border-radius:8px}
  .markdown-body code{font-size:.75rem}
  .markdown-body table{font-size:.75rem}
  .markdown-body td,.markdown-body th{padding:.35em .5em}
  mjx-container{font-size:.92em!important;overflow-x:auto}

  /* ── Input Bar (fixed bottom on mobile) ── */
  .chat-input-bar{
    position:sticky;bottom:0;background:var(--cream);
    padding:.5rem .5rem;margin-top:.3rem;gap:.3rem;
    border-top:1px solid var(--border);
    padding-bottom:max(.5rem, env(safe-area-inset-bottom));
  }
  .chat-attach{width:44px;height:44px;border-radius:10px;font-size:1.3rem}
  .chat-input{padding:.6rem .8rem;font-size:.88rem;min-height:44px;border-radius:10px}
  .chat-send{padding:.6rem 1rem;font-size:.88rem;min-height:44px;border-radius:10px}

  /* ── Image Preview ── */
  .img-preview-bar{padding:.5rem 0;gap:.5rem;flex-wrap:wrap}
  .img-preview-thumb{width:56px;height:44px;border-radius:6px}
  .img-preview-name{font-size:.72rem}
  .img-preview-close{width:44px;height:44px;font-size:1.1rem}
  .chip{padding:.35rem .7rem;font-size:.7rem}

  /* ── Mistakes ── */
  #mistakesPanel{padding:.2rem 0}
  .tag-group-header{padding:.6rem .8rem;border-radius:10px}
  .tag-group-label{font-size:.82rem}
  .tag-group-body{margin-left:.6rem;padding-left:.5rem}
  .tag-subgroup-header{padding:.4rem .6rem}
  .tag-subgroup-label{font-size:.75rem}
  .mistake-card{padding:.7rem .8rem;border-radius:8px}
  .mistake-text{font-size:.78rem}
  .mistake-tag{font-size:.58rem}
  .mistake-empty{padding:3rem 1rem}
  .mistake-empty .icon{font-size:2rem}

  /* ── Login ── */
  .login-screen{padding:1rem}
  .login-card{max-width:100%;padding:2rem 1.5rem;border-radius:12px}
  .login-title{font-size:2rem}
  .login-sub{font-size:.82rem;margin-bottom:1.5rem}
  .login-input{padding:.75rem .9rem;font-size:.88rem;min-height:44px}
  .btn{padding:.75rem 1.2rem;font-size:.88rem;min-height:44px}
  .login-mark{font-size:.6rem}
  .tab{padding:.4rem .8rem;font-size:.78rem;min-height:44px;display:flex;align-items:center}

  /* ── Conversation Modal ── */
  .conv-modal-header{padding:.5rem .7rem}
  .conv-modal-back{width:36px;height:36px;font-size:1.1rem}
  .conv-modal-title{font-size:.88rem}
  .conv-modal-body{padding:.5rem}
  .conv-modal-body .msg.assistant .msg-bubble{font-size:.82rem}
  .conv-modal-body .msg.user .msg-bubble{font-size:.78rem}

  /* ── MathJax overflow ── */
  mjx-container[display=true]{overflow-x:auto;-webkit-overflow-scrolling:touch}
}

/* Hide hamburger on desktop */
@media(min-width:769px){
  .hamburger{display:none}
  .sidebar-close-btn{display:none}
}
</style>
</head>
<body>

<!-- ═══════ LOGIN ═══════ -->
<div class="login-screen" id="loginScreen">
<div class="login-card" id="loginCard">
  <div class="login-mark">ACADEMIC</div>
  <div class="login-title">AgentDome</div>
  <div class="login-sub">AI 智能解题助手 · 课堂演示</div>

  <!-- Tab switcher -->
  <div class="tabs" style="justify-content:center;margin-bottom:1.2rem;gap:.4rem">
    <div class="tab active" data-auth="login" onclick="switchAuthTab('login')">登录</div>
    <div class="tab" data-auth="register" onclick="switchAuthTab('register')">注册</div>
  </div>

  <!-- Login form -->
  <div id="authLoginForm">
    <button class="btn btn-primary" id="btnGuest" onclick="doGuestLogin()">游客登录</button>
    <div class="login-divider">或密码登录</div>
    <input class="login-input" id="loginUser" placeholder="用户名">
    <input class="login-input" id="loginPass" type="password" placeholder="密码">
    <button class="btn btn-primary" id="btnLogin" onclick="doWebLogin()">登录</button>
  </div>

  <!-- Register form (hidden by default) -->
  <div id="authRegisterForm" class="hidden">
    <input class="login-input" id="regUser" placeholder="用户名">
    <input class="login-input" id="regNick" placeholder="昵称（选填）">
    <input class="login-input" id="regPass" type="password" placeholder="密码">
    <input class="login-input" id="regPass2" type="password" placeholder="确认密码">
    <button class="btn btn-primary" id="btnRegister" onclick="doRegister()">注册</button>
  </div>

  <div class="hidden" id="loginError"></div>
</div>
</div>

<!-- ═══════ MAIN APP ═══════ -->
<div class="app hidden" id="mainApp">
<div class="app-layout">
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <button class="sidebar-close-btn" onclick="toggleSidebar()" aria-label="关闭菜单">✕</button>
    <button class="new-chat-btn" onclick="newChat()">+ 新建对话</button>
  </div>
  <div class="session-list" id="sessionList"></div>
</div>
<!-- Main -->
<div class="main-content">
<div class="topbar">
  <button class="hamburger" onclick="toggleSidebar()" aria-label="菜单">☰</button>
  <div class="brand">
    <span class="brand-mark">AD</span>
    <span class="brand-text">AgentDome</span>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="solve" onclick="switchTab('solve')">解题</div>
    <div class="tab" data-tab="mistakes" onclick="switchTab('mistakes')">错题本</div>
  </div>
  <div class="user-tag">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">连接中…</span>
    <span style="margin-left:.5rem" id="userName">--</span>
    <button onclick="doLogout()" style="margin-left:.8rem;background:none;border:1px solid var(--border);color:var(--ink2);cursor:pointer;padding:.2rem .7rem;border-radius:6px;font-size:.7rem;font-family:'Source Serif 4',Georgia,serif">退出</button>
  </div>
</div>

<!-- ═══ SOLVE PANEL ═══ -->
<div id="solvePanel">
  <input type="file" id="fileInput" accept="image/*">

  <div class="chat-area" id="chatArea"
       ondragover="event.preventDefault();this.style.background='var(--accent-lt)'"
       ondragleave="this.style.background=''"
       ondrop="event.preventDefault();this.style.background='';if(event.dataTransfer.files[0])procFile(event.dataTransfer.files[0])">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">◈</div>
      <div class="empty-title">AgentDome 解题助手</div>
      <div class="empty-sub">上传题目图片，AI 实时流式输出解答<br>支持追问和讨论</div>
      <button class="upload-hint-btn" onclick="document.getElementById('fileInput').click()">📷 拍照/上传题目</button>
    </div>
  </div>

  <div class="img-preview-bar" id="imgPreviewBar">
    <img class="img-preview-thumb" id="imgPreviewThumb" src="">
    <span class="img-preview-name" id="imgPreviewName"></span>
    <div class="subject-chips" id="imgSubjectChips">
      <div class="chip active" data-subject="ACM">⊿ 算法</div>
      <div class="chip" data-subject="MATH">∫ 数学</div>
      <div class="chip" data-subject="CS408">⊕ 408</div>
    </div>
    <button class="img-preview-close" onclick="cancelImage()">✕</button>
  </div>

  <div class="chat-input-bar">
    <button class="chat-attach" id="chatAttach" onclick="document.getElementById('fileInput').click()" title="上传图片">🖼</button>
    <input class="chat-input" id="chatInput" placeholder="输入追问，或上传图片解题…" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}">
    <button class="chat-send" onclick="sendMessage()">发送</button>
  </div>
</div>

<!-- ═══ MISTAKES PANEL ═══ -->
<div id="mistakesPanel">
  <div class="mistake-empty" id="mistakesEmpty">
    <div class="icon">📋</div>
    <div class="empty-title">错题本为空</div>
    <div class="empty-sub">解题时 AI 会自动识别错题<br>你也可以在对话中告诉 AI 将题目加入错题本</div>
  </div>
</div>
</div></div></div>

<!-- ═══════ CONVERSATION MODAL ═══════ -->
<div class="conv-modal" id="convModal">
  <div class="conv-modal-header">
    <button class="conv-modal-back" onclick="closeConversation()">←</button>
    <span class="conv-modal-title" id="convTitle">错题详情</span>
    <div class="conv-modal-tags" id="convTags"></div>
  </div>
  <div class="conv-modal-body" id="convBody"></div>
</div>

<script>
// Bypass ngrok browser warning for API requests
(function(){
  var _fetch=window.fetch;
  window.fetch=function(u,o){
    o=o||{};o.headers=o.headers||{};
    o.headers['ngrok-skip-browser-warning']='1';
    return _fetch(u,o);
  };
})();

var S={token:null,userId:null,nick:'',sessionId:null,ws:null,subject:'ACM',pendingFile:null,currentTab:'solve',lastPong:0,heartbeat:null};
var $=function(s){return document.querySelector(s);};
var $$=function(s){return document.querySelectorAll(s);};
var _streamText='',_msgStreaming=false;

// ── Auto-restore session on page load ──
(function(){
  var t=localStorage.getItem('ad_token');
  var u=localStorage.getItem('ad_uid');
  var n=localStorage.getItem('ad_nick');
  if(t&&u&&n){enterApp(t,parseInt(u),n)}
})();

// ── Marked + MathJax ──
if(typeof marked!=='undefined'){
  marked.setOptions({highlight:function(code,lang){if(lang&&hljs.getLanguage(lang))return hljs.highlight(code,{language:lang}).value;return hljs.highlightAuto(code).value;},breaks:true,gfm:true});
}
function md(s){try{
  // Protect LaTeX from markdown underscore/asterisk processing
  var math=[];
  s=s.replace(/(\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|\$[^$\n\r]+?\$)/g,function(m){
    math.push(m);return'␀M'+(math.length-1)+'␀';
  });
  var html=marked.parse(s);
  html=html.replace(/␀M(\d+)␀/g,function(_,i){return math[parseInt(i)]});
  return html;
}catch(e){return esc(s)}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function typeset(el){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([el]).catch(function(){})}
function now(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}

// ── Tab switching ──
function switchTab(tab){
  S.currentTab=tab;
  $$('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.tab===tab)});
  $('#solvePanel').style.display=tab==='solve'?'flex':'none';
  $('#mistakesPanel').style.display=tab==='mistakes'?'block':'none';
  if(tab==='mistakes')loadMistakes();
}
// ── Auth Tabs ──
function switchAuthTab(tab){
  $$('#loginCard .tab').forEach(function(t){t.classList.toggle('active',t.dataset.auth===tab)});
  $('#authLoginForm').classList.toggle('hidden',tab!=='login');
  $('#authRegisterForm').classList.toggle('hidden',tab!=='register');
}

// ── Login ──
async function doGuestLogin(){
  var b=$('#btnGuest');b.textContent='登录中…';b.disabled=true;
  try{
    var r=await fetch('/api/auth/guest',{method:'POST',headers:{'Content-Type':'application/json'}});
    var d=await r.json();
    if(d.token)enterApp(d.token,d.userId,d.nickname||'观众');
  }catch(e){showError('连接失败，请确认后端已启动');b.textContent='游客登录';b.disabled=false;}
}
async function doWebLogin(){
  var u=$('#loginUser').value.trim(),p=$('#loginPass').value;
  if(!u||!p){showError('请输入用户名和密码');return;}
  var b=$('#btnLogin');b.textContent='登录中…';b.disabled=true;
  try{
    var r=await fetch('/api/auth/web-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    var d=await r.json();
    if(d.token)enterApp(d.token,d.userId,d.nickname||u);
    else showError(d.message||'登录失败');
  }catch(e){showError('连接失败')}
  b.textContent='登录';b.disabled=false;
}
async function doRegister(){
  var u=$('#regUser').value.trim(),n=$('#regNick').value.trim(),p=$('#regPass').value,p2=$('#regPass2').value;
  if(!u||!p){showError('用户名和密码不能为空');return;}
  if(p!==p2){showError('两次密码不一致');return;}
  var b=$('#btnRegister');b.textContent='注册中…';b.disabled=true;
  try{
    var r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,nickname:n||u})});
    var d=await r.json();
    if(d.token)enterApp(d.token,d.userId,d.nickname||n||u);
    else showError(d.message||'注册失败');
  }catch(e){showError('连接失败')}
  b.textContent='注册';b.disabled=false;
}
function doLogout(){
  stopHeartbeat();
  if(S.ws){S.ws.onclose=null;S.ws.close();}
  localStorage.removeItem('ad_token');localStorage.removeItem('ad_uid');localStorage.removeItem('ad_nick');
  S={token:null,userId:null,nick:'',sessionId:null,ws:null,subject:'ACM',pendingFile:null,currentTab:'solve',lastPong:0,heartbeat:null};
  $('#mainApp').classList.add('hidden');$('#loginScreen').classList.remove('hidden');
  $('#chatArea').innerHTML='<div class="empty-state" id="emptyState"><div class="empty-icon">◈</div><div class="empty-title">AgentDome 解题助手</div><div class="empty-sub">上传题目图片，AI 实时流式输出解答<br>支持追问和讨论</div><button class="upload-hint-btn" onclick="document.getElementById(\'fileInput\').click()">📷 拍照/上传题目</button></div>';
  $('#sessionList').innerHTML='';$('#userName').textContent='--';setStatus(false,'已退出');
}
function showError(m){var e=$('#loginError');e.textContent=m;e.classList.remove('hidden');setTimeout(function(){e.classList.add('hidden')},3000)}
function enterApp(t,u,n){
  S.token=t;S.userId=u;S.nick=n;
  localStorage.setItem('ad_token',t);localStorage.setItem('ad_uid',u);localStorage.setItem('ad_nick',n);
  $('#loginScreen').classList.add('hidden');$('#mainApp').classList.remove('hidden');
  $('#userName').textContent=n;connectWS();loadSessions();
}

// ── Session History ──
function loadSessions(){
  if(!S.token)return;
  fetch('/api/chat/sessions',{headers:{'Authorization':'Bearer '+S.token}})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.code===200)renderSessionList(d.data||[]);
    }).catch(function(){});
}
function renderSessionList(sessions){
  var el=$('#sessionList');if(!el)return;
  el.innerHTML=sessions.map(function(s){
    var date=s.createdAt?new Date(s.createdAt).toLocaleDateString('zh-CN'):'';
    return '<div class="session-item'+(s.sessionId===S.sessionId?' active':'')+'" onclick="selectSession(\''+s.sessionId+'\')">'+
      '<button class="session-item-del" onclick="event.stopPropagation();deleteSession(\''+s.sessionId+'\')" title="删除">×</button>'+
      '<div class="session-item-title">'+esc(s.title||'新对话')+'</div>'+
      '<div class="session-item-meta">'+date+' · '+(s.messageCount||0)+' 条消息</div></div>';
  }).join('');
}
function toggleSidebar(){
  var sb=$('#sidebar');var ov=$('#sidebarOverlay');if(!sb)return;
  var open=!sb.classList.contains('open');
  if(open){sb.classList.add('open');if(ov)ov.classList.add('show')}
  else{sb.classList.remove('open');if(ov)ov.classList.remove('show')}
}
function closeSidebar(){$('#sidebar').classList.remove('open');var ov=$('#sidebarOverlay');if(ov)ov.classList.remove('show')}
function newChat(){
  S.sessionId=null;_streamText='';S._wasStreaming=false;
  $('#chatArea').innerHTML='<div class="empty-state" id="emptyState"><div class="empty-icon">◈</div><div class="empty-title">AgentDome 解题助手</div><div class="empty-sub">上传题目图片，AI 实时流式输出解答<br>支持追问和讨论</div><button class="upload-hint-btn" onclick="document.getElementById(\'fileInput\').click()">📷 拍照/上传题目</button></div>';
  if(S.ws){S.ws.onclose=null;S.ws.close();}
  connectWS();closeSidebar();
}
function selectSession(sessionId){
  if(!S.token||sessionId===S.sessionId)return;
  fetch('/api/chat/sessions/'+sessionId,{headers:{'Authorization':'Bearer '+S.token}})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.code!==200||!d.data)return;
      var doc=d.data;
      S.sessionId=sessionId;
      var chat=$('#chatArea');chat.innerHTML='';
      var emptyEl=document.getElementById('emptyState');
      if(emptyEl)emptyEl.style.display='none';
      (doc.messages||[]).forEach(function(m){
        if(m.role==='system')return;
        var role=m.role==='user'?'user':'assistant';
        addHistoryMsg(role,m.content,m.timestamp);
      });
      // Reconnect WS with the selected session
      if(S.ws){S.ws.onclose=null;S.ws.close();}
      connectWS(sessionId);closeSidebar();
    }).catch(function(){});
}
function deleteSession(sessionId){
  if(!S.token||!confirm('确定删除该对话？'))return;
  fetch('/api/chat/sessions/'+sessionId,{method:'DELETE',headers:{'Authorization':'Bearer '+S.token}})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.code===200){
        if(S.sessionId===sessionId){S.sessionId=null;_streamText='';$('#chatArea').innerHTML='<div class="empty-state" id="emptyState"><div class="empty-icon">◈</div><div class="empty-title">AgentDome 解题助手</div><div class="empty-sub">上传题目图片，AI 实时流式输出解答<br>支持追问和讨论</div><button class="upload-hint-btn" onclick="document.getElementById(\'fileInput\').click()">📷 拍照/上传题目</button></div>';}
        loadSessions();
      }
    }).catch(function(){});
}
function addHistoryMsg(role,text,ts){
  var d=document.createElement('div');d.className='msg '+role;
  var av=role==='assistant'?'AI':(S.nick.charAt(0)||'?');
  var rn=role==='assistant'?'AI 助手':S.nick;
  var time=ts?new Date(ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'';
  var isMd=role==='assistant'&&text;
  d.innerHTML='<div class="msg-header"><div class="msg-avatar">'+av+'</div><span class="msg-name">'+rn+'</span><span class="msg-time">'+time+'</span></div>'+
    '<div class="msg-body"><div class="msg-bubble'+(isMd?' markdown-body':'')+'">'+(isMd?md(text):esc(text))+'</div></div>';
  $('#chatArea').appendChild(d);
  if(isMd)requestAnimationFrame(function(){typeset(d)});
  $('#chatArea').scrollTop=$('#chatArea').scrollHeight;
}

// ── WebSocket ──
function connectWS(sessionId){
  var proto=location.protocol==='https:'?'wss':'ws';
  var url=proto+'://'+location.host+'/ws/chat?token='+S.token;
  if(sessionId)url+='&sessionId='+sessionId;
  S.ws=new WebSocket(url);
  S.ws.onopen=function(){setStatus(true,'在线');S.lastPong=Date.now();startHeartbeat();if(S._wasStreaming)recoverStream()};
  S.ws.onmessage=function(e){
    var m=JSON.parse(e.data);
    if(m.type==='pong'){S.lastPong=Date.now();return}
    if(m.type==='connected'){
      S.sessionId=m.sessionId;loadSessions();
      if(S._wasStreaming)recoverStream();
    }
    else if(m.type==='solve-start'){addMsg('assistant','',true)}
    else if(m.type==='solve-chunk'){appendStream(m.chunk)}
    else if(m.type==='solve-done'){finishStream();loadSessions();S._wasStreaming=false}
    else if(m.type==='solve-error'){appendStream('\n\n[错误: '+m.message+']');finishStream();loadSessions();S._wasStreaming=false}
    else if(m.type==='problem-saved'){}
    else if(m.type=='message-chunk'){
      if(!_msgStreaming){_msgStreaming=true;addMsg('assistant','',true)}
      appendStream(m.chunk);
    }
    else if(m.type=='message-done'){_msgStreaming=false;finishStream();loadSessions();S._wasStreaming=false}
    else if(m.type=='message-error'){_msgStreaming=false;appendStream('\n\n[错误: '+m.message+']');finishStream();loadSessions();S._wasStreaming=false}
    else if(m.type=='message'){addMsg('assistant',m.content)}
  };
  S.ws.onclose=function(){
    setStatus(false,'重连中…');
    stopHeartbeat();
    if(_streamText){S._wasStreaming=true;addMsg('assistant','⚠ 连接中断，正在重连…');_streamText=''}
    setTimeout(function(){connectWS(S.sessionId)},3000);
  };
  S.ws.onerror=function(){setStatus(false,'错误')};
}
// Recover stream after reconnection — reload session to get server-saved messages
function recoverStream(){
  if(!S.sessionId||!S.token)return;
  fetch('/api/chat/sessions/'+S.sessionId,{headers:{'Authorization':'Bearer '+S.token}})
    .then(function(r){return r.json()})
    .then(function(d){
      if(!d.data||!d.data.messages)return;
      // Find the last assistant message (the completed AI response)
      var msgs=d.data.messages;
      var lastAsst=null;
      for(var i=msgs.length-1;i>=0;i--){if(msgs[i].role==='assistant'){lastAsst=msgs[i];break}}
      if(lastAsst){
        // Replace the "connecting" placeholder with the actual response
        var bs=$$('#chatArea .msg.assistant .msg-bubble');
        for(var j=bs.length-1;j>=0;j--){
          if(bs[j].textContent.indexOf('连接中断')>=0){
            bs[j].classList.remove('streaming');bs[j].classList.add('markdown-body');
            bs[j].innerHTML=md(lastAsst.content);
            requestAnimationFrame(function(){typeset(bs[j])});
            break;
          }
        }
      }
      S._wasStreaming=false;
    }).catch(function(){S._wasStreaming=false});
}
// Page Visibility — reconnect when user returns to tab
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&S.token&&(!S.ws||S.ws.readyState!==WebSocket.OPEN)){
    connectWS(S.sessionId);
  }
});
function startHeartbeat(){
  stopHeartbeat();
  S.lastPong=Date.now();
  S.heartbeat=setInterval(function(){
    if(S.ws&&S.ws.readyState===WebSocket.OPEN){
      S.ws.send(JSON.stringify({type:'ping'}));
      if(Date.now()-S.lastPong>30000){
        // No pong for 30s — connection dead, reconnect
        if(S.ws){S.ws.onclose=null;S.ws.close();}
        connectWS(S.sessionId);
      }
    }
  },15000);
}
function stopHeartbeat(){if(S.heartbeat){clearInterval(S.heartbeat);S.heartbeat=null}}
function setStatus(on,m){$('#statusDot').className='status-dot'+(on?'':' off');$('#statusText').textContent=m}

// ── Chat Messages ──
var chatArea=$('#chatArea');
function hideEmpty(){var e=$('#emptyState');if(e)e.style.display='none'}
function addMsg(role,text,streaming){
  hideEmpty();
  var d=document.createElement('div');d.className='msg '+role;
  var av=role==='assistant'?'AI':(S.nick.charAt(0)||'?');
  var rn=role==='assistant'?'AI 助手':S.nick;
  var cls=streaming?' streaming':'';var isMd=role==='assistant'&&text;
  if(streaming)_streamText='';
  d.innerHTML='<div class="msg-header"><div class="msg-avatar">'+av+'</div><span class="msg-name">'+rn+'</span><span class="msg-time">'+now()+'</span></div>'+
    '<div class="msg-body"><div class="msg-bubble'+cls+(isMd?' markdown-body':'')+'">'+(isMd?md(text):esc(text))+(streaming?'<span class="stream-cursor"></span>':'')+'</div></div>';
  chatArea.appendChild(d);
  if(isMd&&!streaming)requestAnimationFrame(function(){typeset(d)});
  chatArea.scrollTop=chatArea.scrollHeight;
}
function appendStream(text){
  _streamText+=text;
  var ms=$$('#chatArea .msg.assistant');var l=ms[ms.length-1];if(!l)return;
  l.querySelector('.msg-bubble').innerHTML=esc(_streamText)+'<span class="stream-cursor"></span>';
  chatArea.scrollTop=chatArea.scrollHeight;
}
function finishStream(){
  var ms=$$('#chatArea .msg.assistant');var l=ms[ms.length-1];if(!l)return;
  var b=l.querySelector('.msg-bubble');b.classList.remove('streaming');b.classList.add('markdown-body');
  b.innerHTML=md(_streamText);_streamText='';
  requestAnimationFrame(function(){typeset(b)});
}

// ── Subject chips (for image preview bar) ──
$$('#imgSubjectChips .chip').forEach(function(c){c.onclick=function(e){e.stopPropagation();$$('#imgSubjectChips .chip').forEach(function(x){x.classList.remove('active')});c.classList.add('active');S.subject=c.dataset.subject}});

// ── Send Message (text or image) ──
function sendMessage(){
  var input=$('#chatInput');var text=input.value.trim();
  if(S.pendingFile){
    // Send image
    input.value='';addMsg('user','📷 '+S.subject+' 题目');addMsg('assistant','⏳ 识别中…');
    doUpload();
  }else if(text){
    // Send text
    if(!S.ws||S.ws.readyState!==WebSocket.OPEN)return;
    input.value='';addMsg('user',text);
    S.ws.send(JSON.stringify({type:'text',content:text}));
  }
}

// ── Image Handling ──
var pendingInput=$('#fileInput');
pendingInput.onchange=function(){if(pendingInput.files[0])procFile(pendingInput.files[0])};
function procFile(file){
  S.pendingFile=file;
  var reader=new FileReader();
  reader.onload=function(e){
    $('#imgPreviewThumb').src=e.target.result;
    $('#imgPreviewName').textContent=file.name;
    $('#imgPreviewBar').classList.add('show');
    $('#chatAttach').classList.add('has-file');
  };
  reader.readAsDataURL(file);
}
function cancelImage(){
  S.pendingFile=null;pendingInput.value='';
  $('#imgPreviewBar').classList.remove('show');
  $('#chatAttach').classList.remove('has-file');
}

async function doUpload(){
  if(!S.pendingFile||!S.token)return;
  var f=new FormData();f.append('file',S.pendingFile);f.append('subjectType',S.subject);f.append('sessionId',S.sessionId||'web');f.append('token',S.token);
  cancelImage();
  try{
    var r=await fetch('/api/chat/upload?token='+S.token,{method:'POST',body:f});
    var d=await r.json();
    var bs=$$('#chatArea .msg.assistant .msg-bubble');var lb=bs[bs.length-1];
    if(d.code===200){
      lb.innerHTML='📷 识别结果：<br><br>'+esc(d.data.cleanedText);lb.style.borderLeftColor='var(--green)';
      if(S.ws&&S.ws.readyState===WebSocket.OPEN)S.ws.send(JSON.stringify({type:'solve',text:d.data.cleanedText,subjectType:d.data.subjectType}));
    }else{lb.innerHTML='✕ 识别失败';lb.style.borderLeftColor='var(--red)'}
  }catch(e){addMsg('assistant','✕ 网络错误: '+e.message)}
}

// ── Mistakes ──
async function loadMistakes(){
  if(!S.token)return;
  try{
    var r=await fetch('/api/mistakes',{headers:{'Authorization':'Bearer '+S.token}});
    if(!r.ok){showMistakesEmpty('暂无错题');return}
    var d=await r.json();
    var items=(d.data||[]);
    if(!items.length){showMistakesEmpty('暂无错题','解题时会自动记录');return}

    // Group by primary tag → secondary tag
    var groups={};var uncategorized=[];
    items.forEach(function(m){
      var tags=m.tags||[];
      var primary=tags[0]||null;
      var secondary=tags[1]||null;
      if(!primary){uncategorized.push(m);return;}
      if(!groups[primary])groups[primary]={};
      if(!groups[primary][secondary||'其他'])groups[primary][secondary||'其他']=[];
      groups[primary][secondary||'其他'].push(m);
    });

    // Store mistakes lookup for onclick — avoids escaping issues
    S._mistakes={};
    function cardHTML(m,showSubject){
      var date=new Date(m.createdAt).toLocaleDateString('zh-CN');
      var rawTitle=m.cleanedText||'题目预览';
      S._mistakes[m.id]=m;
      return '<div class="mistake-card" onclick="viewConversation('+m.id+')">'+
        '<div class="mistake-date">'+date+' · #'+m.id+'</div>'+
        '<div class="mistake-text">'+esc(rawTitle)+'</div>'+
        '<div class="mistake-meta">'+
          (showSubject&&m.subjectType?'<span class="mistake-tag">'+esc(m.subjectType)+'</span>':'')+
          (m.errorType?'<span class="mistake-tag error-type">'+esc(m.errorType)+'</span>':'')+
          (m.tags||[]).slice(showSubject?1:0).map(function(t){return '<span class="mistake-tag">'+esc(t)+'</span>'}).join('')+
          '<span style="font-size:.65rem;color:var(--accent);margin-left:auto">查看对话 →</span>'+
        '</div></div>';
    }

    var html='';var gid=0;
    Object.keys(groups).sort().forEach(function(primary){
      var subgroups=groups[primary];
      var total=0;Object.values(subgroups).forEach(function(s){total+=s.length});
      html+='<div class="tag-group">';
      html+='<div class="tag-group-header" onclick="toggleTagGroup('+gid+')">';
      html+='<span class="tag-group-arrow">▶</span>';
      html+='<span class="tag-group-label">'+esc(primary)+'</span>';
      html+='<span class="tag-group-count">'+total+'题</span></div>';
      html+='<div class="tag-group-body" id="tgb'+gid+'">';
      var sgid=0;
      Object.keys(subgroups).sort().forEach(function(secondary){
        var mistakes=subgroups[secondary];
        var sid=gid+'_'+sgid;
        html+='<div class="tag-subgroup">';
        html+='<div class="tag-subgroup-header" onclick="event.stopPropagation();toggleTagSubgroup(\''+sid+'\')">';
        html+='<span class="tag-subgroup-arrow">▶</span>';
        html+='<span class="tag-subgroup-label">'+esc(secondary)+'</span>';
        html+='<span class="tag-subgroup-count">'+mistakes.length+'题</span></div>';
        html+='<div class="tag-subgroup-body" id="tgsb'+sid+'">';
        mistakes.forEach(function(m){html+=cardHTML(m,false)});
        html+='</div></div>';
        sgid++;
      });
      html+='</div></div>';
      gid++;
    });

    if(uncategorized.length){
      html+='<div class="tag-group">';
      html+='<div class="tag-group-header" onclick="toggleTagGroup('+gid+')">';
      html+='<span class="tag-group-arrow">▶</span>';
      html+='<span class="tag-group-label">未分类</span>';
      html+='<span class="tag-group-count">'+uncategorized.length+'题</span></div>';
      html+='<div class="tag-group-body" id="tgb'+gid+'">';
      uncategorized.forEach(function(m){html+=cardHTML(m,true)});
      html+='</div></div>';
    }

    $('#mistakesPanel').innerHTML=html;
  }catch(e){showMistakesEmpty('加载失败')}
}
function showMistakesEmpty(title,sub){
  $('#mistakesPanel').innerHTML='<div class="mistake-empty"><div class="icon">📋</div><div class="empty-title">'+title+'</div>'+(sub?'<div class="empty-sub">'+sub+'</div>':'')+'</div>';
}
function toggleTagGroup(gid){
  var b=$('#tgb'+gid);var h=b?b.parentElement.querySelector('.tag-group-header'):null;
  if(!b)return;
  if(b.classList.contains('open')){b.classList.remove('open');if(h)h.classList.remove('open')}
  else{b.classList.add('open');if(h)h.classList.add('open')}
}
function toggleTagSubgroup(sid){
  var b=$('#tgsb'+sid);var h=b?b.parentElement.querySelector('.tag-subgroup-header'):null;
  if(!b)return;
  if(b.classList.contains('open')){b.classList.remove('open');if(h)h.classList.remove('open')}
  else{b.classList.add('open');if(h)h.classList.add('open')}
}
// ── Conversation Modal ──
function viewConversation(mistakeId){
  if(!S.token)return;
  var m=S._mistakes&&S._mistakes[mistakeId];
  if(!m)return;
  var title=m.cleanedText||'题目预览';
  $('#convTitle').textContent=title.length>40?title.substring(0,40)+'…':title;
  var tagsHtml='';
  (m.tags||[]).forEach(function(t){if(t)tagsHtml+='<span class="mistake-tag">'+esc(t)+'</span>'});
  $('#convTags').innerHTML=tagsHtml;
  $('#convModal').classList.add('open');

  // Always show solution text
  var html='';
  html+='<div class="msg assistant"><div class="msg-header"><div class="msg-avatar">AI</div><span class="msg-name">AI 解答</span></div>'+
    '<div class="msg-body"><div class="msg-bubble markdown-body">'+md(m.solutionText||'暂无解答')+'</div></div></div>';

  // If sessionId exists, also load full conversation
  if(m.sessionId){
    $('#convBody').innerHTML='<div style="text-align:center;padding:2rem;color:var(--ink3)">加载对话记录…</div>';
    fetch('/api/chat/sessions/'+m.sessionId,{headers:{'Authorization':'Bearer '+S.token}})
      .then(function(r){return r.json()})
      .then(function(d){
        var fullHtml='';
        if(d.data&&d.data.messages){
          d.data.messages.forEach(function(msg){
            if(msg.role==='system')return;
            var role=msg.role==='user'?'user':'assistant';
            var av=role==='assistant'?'AI':'U';
            var rn=role==='assistant'?'AI 助手':'用户';
            var time=msg.timestamp?new Date(msg.timestamp).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'';
            var isMd=role==='assistant';
            fullHtml+='<div class="msg '+role+'"><div class="msg-header"><div class="msg-avatar">'+av+'</div><span class="msg-name">'+rn+'</span><span class="msg-time">'+time+'</span></div>'+
              '<div class="msg-body"><div class="msg-bubble'+(isMd?' markdown-body':'')+'">'+(isMd?md(msg.content):esc(msg.content))+'</div></div></div>';
          });
        }
        $('#convBody').innerHTML=fullHtml||html;
        requestAnimationFrame(function(){$$('#convBody .markdown-body').forEach(function(el){typeset(el)})});
      }).catch(function(){$('#convBody').innerHTML=html});
  }else{
    $('#convBody').innerHTML=html;
    requestAnimationFrame(function(){$$('#convBody .markdown-body').forEach(function(el){typeset(el)})});
  }
}
function closeConversation(){$('#convModal').classList.remove('open')}

</script>
